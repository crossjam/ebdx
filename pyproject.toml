[project]
name = "ebdx"
version = "0.1.0"
description = "CLI tool to index EPUB metadata into a SQLite database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "loguru>=0.7",
    "rich>=13.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "platformdirs>=4.0",
    "sqlite-utils>=3.36",
]

[tool.poe.tasks]
# Linting
[tool.poe.tasks.lint]
help = "Run ruff linter on source and test files"
cmd = "ruff check src/ tests/"

[tool.poe.tasks."lint:fix"]
help = "Run ruff linter and auto-fix issues"
cmd = "ruff check --fix src/ tests/"

# Formatting
[tool.poe.tasks.format]
help = "Format source and test files with ruff"
cmd = "ruff format src/ tests/"

[tool.poe.tasks."format:check"]
help = "Check formatting without modifying files"
cmd = "ruff format --check src/ tests/"

# Type checking
[tool.poe.tasks.type]
help = "Run ty type checker on source files"
cmd = "ty check src/"

# Testing
[tool.poe.tasks.test]
help = "Run pytest with verbose output"
cmd = "pytest -v"

[tool.poe.tasks."test:cov"]
help = "Run pytest with coverage report (terminal + HTML)"
cmd = "pytest --cov=ebdx --cov-report=term-missing --cov-report=html"

[tool.poe.tasks."test:quick"]
help = "Run pytest and stop on first failure"
cmd = "pytest -x"

# Documentation
[tool.poe.tasks.markdown]
help = "Process markdown files with flowmark"
cmd = "flowmark plans/*.md"

# Combined QA - run all checks
[tool.poe.tasks.qa]
help = "Run all QA checks (lint, type, test)"
sequence = ["lint", "type", "test"]
ignore_fail = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=4.0.0",
    "poethepoet>=0.26",
    "ty>=0.0.40",
    "flowmark-rs>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "poethepoet>=0.26",
    "ruff>=0.4",
    "ty>=0.0.40",
    "flowmark-rs>=0.3",
    "pytest-cov>=4.0.0",
]

[project.scripts]
ebdx = "ebdx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ebdx"]

[tool.ty]
# Ty configuration - lenient settings for gradual type annotation adoption

[tool.ty.rules]
# Ignore certain rules to allow working with sqlite_utils types
unresolved-import = "ignore"
possibly-missing-attribute = "ignore"
unsupported-operator = "ignore"
invalid-parameter-default = "ignore"
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"
too-many-positional-arguments = "ignore"
invalid-return-type = "ignore"
